<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسابقة الثقافية والدينية للجوالة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --scout-green: #1f4e3d;
            --scout-light-green: #2a6f55;
            --scout-brown: #8b5a2b;
            --scout-sand: #f4ecd8;
            --gold: #d4af37;
            --danger: #dc3545;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--scout-green);
            background-image: radial-gradient(circle at 50% 0%, var(--scout-light-green) 0%, var(--scout-green) 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .container {
            background-color: var(--scout-sand);
            width: 95%;
            max-width: 700px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 4px solid var(--scout-brown);
        }

        .header {
            border-bottom: 2px dashed var(--scout-brown);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        /* تنسيق الشعارات الجديدة */
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid var(--gold);
            background: white;
            padding: 5px;
        }

        h1 {
            color: var(--scout-green);
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: var(--scout-green);
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--scout-brown);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            background-color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--scout-green);
        }

        .start-btn {
            background-color: var(--scout-green);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.3s;
        }

        .start-btn:hover {
            background-color: var(--scout-light-green);
        }

        /* تنسيق المؤقت */
        .timer-container {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--scout-green);
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            border: 2px solid var(--scout-brown);
            display: inline-block;
            margin-bottom: 15px;
            min-width: 120px;
        }

        .timer-danger {
            color: var(--danger);
            animation: pulse 1s infinite;
        }

        .avatar-container {
            font-size: 4.5rem;
            margin: 5px 0 15px 0;
            transition: transform 0.3s ease;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-container.happy {
            animation: bounce 0.5s ease;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: #111;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--scout-brown);
            color: var(--scout-brown);
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--scout-brown);
            color: white;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
            animation: pulse 0.5s;
        }

        .wrong {
            background-color: var(--danger) !important;
            border-color: var(--danger) !important;
            color: white !important;
            animation: shake 0.4s;
        }

        .hint-box {
            display: none;
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.1rem;
            text-align: right;
            animation: fadeIn 0.5s;
        }

        .next-btn {
            display: none;
            background-color: var(--scout-green);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 25px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.3s;
        }

        .next-btn:hover {
            background-color: var(--scout-light-green);
        }

        .progress {
            margin-top: 25px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--scout-brown);
            background: rgba(139, 90, 43, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(10px);
            }

            60% {
                transform: translateX(-10px);
            }

            80% {
                transform: translateX(10px);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.15);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #f00;
            z-index: 1000;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div class="container" id="main-container">
        <div class="header">
            <!-- مسار الصور (تأكد من تسمية الصور المرفوعة بنفس هذا الاسم) -->
            <div class="logos-container">
                <img src="لوجو جمعية الفتيان.jpeg" alt="شعار جمعية الفتيان" class="logo-img">
                <img src="لوجو درع الجوالة الوطني.jpeg" alt="شعار درع الجوالة الوطني" class="logo-img">
            </div>
            <h1>المسابقة الثقافية والدينية</h1>
            <p>معالمنا، قيمنا المشتركة، وعقيدتنا</p>
        </div>

        <!-- شاشة تسجيل البيانات -->
        <div id="registration-screen">
            <h2 style="color: var(--scout-brown); margin-bottom: 20px;">سجل بياناتك للبدء</h2>
            <div class="form-group">
                <label for="playerName">الاسم الثلاثي:</label>
                <input type="text" id="playerName" placeholder="أدخل اسمك هنا..." required>
            </div>
            <div class="form-group">
                <label for="patrolName">اسم الرهط / الطليعة:</label>
                <input type="text" id="patrolName" placeholder="مثال: رهط الصقر..." required>
            </div>
            <div class="form-group">
                <label for="playerPhone">رقم التليفون (اختياري):</label>
                <input type="tel" id="playerPhone" placeholder="أدخل رقمك للتواصل...">
            </div>
            <button class="start-btn" onclick="validateAndStart()">ابدأ المسابقة الآن ➔</button>
            <p id="error-msg" style="color: red; margin-top: 10px; display: none;">يرجى إدخال الاسم واسم الرهط!</p>
        </div>

        <!-- شاشة المسابقة -->
        <div id="quiz-screen" style="display: none;">
            <div class="timer-container" id="timer-box">⏱️ <span id="time-left">10</span> ث</div>
            <div class="avatar-container" id="avatar">🧑‍🌾</div>
            <div class="question-text" id="question">جاري التحميل...</div>
            <div class="options" id="options"></div>

            <div class="hint-box" id="hint">
                <span class="hint-icon">💡</span> <strong>تلميح أو معلومة:</strong> <span id="hint-text"></span>
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ➔</button>
            <br>
            <div class="progress" id="progress">السؤال 1</div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-screen" style="display: none;"></div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyViuy-9GBNAZzz6HhBFymWKbrSUFh4KWnZWc2pARFZLl6i_LetOPAf3fFKh9mNagbsuQ/exec";

        let userData = { name: "", patrol: "", phone: "", score: 0 };

        // بنك الأسئلة الشامل (أسئلتك القديمة + عينة كبيرة من الأسئلة الجديدة)
        // ملاحظة: correct هو رقم الإجابة الصحيحة (0 يعني أ، 1 يعني ب، 2 يعني ج، 3 يعني د)
        const allQuestions = [
            // --- القسم الأول: القرآن الكريم وعلومه ---
            { question: "ما هي السورة التي تسمى 'قلب القرآن'؟", options: ["يس", "الرحمن", "الواقعة", "الملك"], correct: 0, hint: "سورة تبدأ بحروف مقطعة." },
            { question: "كم عدد السور المكية في القرآن الكريم تقريباً؟", options: ["86 سورة", "28 سورة", "114 سورة", "90 سورة"], correct: 0, hint: "أغلب سور القرآن نزلت قبل الهجرة." },
            { question: "ما هي السورة التي ختمت آيتها الأولى بـ 'الحمد لله'؟", options: ["الفتحة", "الأنعام", "الكهف", "سبأ"], correct: 2, hint: "سورة تحكي قصة أهل الكهف." },
            { question: "من هو النبي الذي ورد اسمه في القرآن الكريم 25 مرة؟", options: ["نوح", "موسى", "عيسى", "إبراهيم"], correct: 1, hint: "كليم الله." },
            { question: "ما هي السورة التي تسمى 'عروس القرآن'؟", options: ["البقرة", "الرحمن", "مريم", "الواقعة"], correct: 1, hint: "تبدأ بـ 'الرحمن علم القرآن'." },
            { question: "ما هي أطول آية في القرآن الكريم؟", options: ["آية الكرسي", "آية الدين", "خاتمة سورة البقرة", "أول سورة الكهف"], correct: 1, hint: "توجد في سورة البقرة وتتحدث عن الدَّين." },
            { question: "في أي سورة وردت 'البسملة' مرتين؟", options: ["التوبة", "النمل", "الفاتحة", "مريم"], correct: 1, hint: "سورة تبدأ بـ 'طس' وتحكي قصة سليمان." },

            { question: "ما هي السورة التي يطلق عليها 'سنام القرآن'؟", options: ["البقرة", "الإسراء", "النحل", "الأعراف"], correct: 0, hint: "أطول سورة في القرآن." },
            { question: "كم مرة ورد لفظ 'الدنيا' في القرآن الكريم؟", options: ["115 مرة", "100 مرة", "150 مرة", "80 مرة"], correct: 0, hint: "يساوي نفس عدد مرات ورود لفظ 'الآخرة'." },

            { question: "ما هي السورة التي تنتهي آياتها بحرف الدال؟", options: ["الإخلاص", "الفلق", "الناس", "الكوثر"], correct: 0, hint: "سورة تعدل ثلث القرآن." },

            { question: "كم عدد السور التي بدأت بـ 'الحمد لله'؟", options: ["5 سور", "7 سور", "4 سور", "10 سور"], correct: 0, hint: "الفاتحة، الأنعام، الكهف، سبأ، فاطر." },

            { question: "من هو الصحابي الذي جمع القرآن في عهد أبي بكر رضي الله عنه؟", options: ["عثمان بن عفان", "علي بن أبي طالب", "زيد بن ثابت", "عمر بن الخطاب"], correct: 2, hint: "كان كاتب الوحي وشاباً حافظاً." },

            { question: "من هو الصحابي الذي قال عنه الرسول ﷺ 'اقرأوا القرآن على أربعة...'؟", options: ["عبد الله بن مسعود", "سالم مولى أبي حذيفة", "أُبي بن كعب", "معاذ بن جبل"], correct: 0, hint: "صاحب السبق في التعلم والتعليم." },

            { question: "من هو أول من جمع المصحف الشريف في عهد عثمان؟", options: ["زيد بن ثابت", "عبد الله بن الزبير", "سعيد بن العاص", "عبد الرحمن بن الحارث"], correct: 0, hint: "هو نفسه من جمعه في عهد أبي بكر." },
            { question: "من هو الصحابي الذي أمره النبي ﷺ بتعلم لغة اليهود؟", options: ["زيد بن ثابت", "عبد الله بن عباس", "معاذ بن جبل", "أُبي بن كعب"], correct: 0, hint: "تعلم السريانية في 17 يوماً." },
            { question: "ما هي السورة التي تسمى 'المعوذات'؟", options: ["الفلق والناس", "الإخلاص والفلق والناس", "الإخلاص فقط", "الكوثر والإخلاص"], correct: 1, hint: "يُستعاذ بها." },
            { question: "ما هي أكبر غزوة في تاريخ الإسلام؟", options: ["بدر", "الخندق", "اليرموك", "القادسية"], correct: 2, hint: "في عهد عمر بن الخطاب." }
        ];

        let currentQuiz = 0;
        let score = 0;
        let selectedQuestions = [];
        const QUESTIONS_PER_GAME = 25; // تم تعديلها إلى 25 سؤال

        let timeLeft = 10;
        let timerInterval;

        function validateAndStart() {
            const nameInput = document.getElementById('playerName').value.trim();
            const patrolInput = document.getElementById('patrolName').value.trim();
            const phoneInput = document.getElementById('playerPhone').value.trim();

            if (nameInput === "" || patrolInput === "") {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            userData.name = nameInput;
            userData.patrol = patrolInput;
            userData.phone = phoneInput;

            document.getElementById('registration-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';

            startGame();
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startGame() {
            selectedQuestions = shuffleArray(allQuestions).slice(0, QUESTIONS_PER_GAME);
            currentQuiz = 0;
            score = 0;
            loadQuiz();
        }

        function startTimer() {
            timeLeft = 10;
            const timerBox = document.getElementById('timer-box');
            const timeDisplay = document.getElementById('time-left');

            timerBox.classList.remove('timer-danger');
            timeDisplay.innerText = timeLeft;
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.innerText = timeLeft;

                if (timeLeft <= 3) {
                    timerBox.classList.add('timer-danger');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function loadQuiz() {
            document.getElementById('hint').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('avatar').innerHTML = "🧑‍🌾";
            document.getElementById('avatar').classList.remove('happy');

            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';

            const currentData = selectedQuestions[currentQuiz];
            document.getElementById('question').innerText = currentData.question;
            document.getElementById('progress').innerText = `السؤال ${currentQuiz + 1} من ${QUESTIONS_PER_GAME}`;

            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = () => selectAnswer(index, button);
                optionsEl.appendChild(button);
            });

            // بدء المؤقت عند تحميل كل سؤال
            startTimer();
        }

        function selectAnswer(selectedIndex, buttonElement) {
            clearInterval(timerInterval); // إيقاف المؤقت عند الإجابة

            const currentData = selectedQuestions[currentQuiz];
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentData.correct) {
                buttonElement.classList.add('correct');
                score++;
                document.getElementById('avatar').innerHTML = "🤩";
                document.getElementById('avatar').classList.add('happy');
                createConfetti();
                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                buttonElement.classList.add('wrong');
                document.getElementById('avatar').innerHTML = "🤔";
                allButtons[currentData.correct].classList.add('correct');

                let hintMsg = currentData.hint || "الإجابة الصحيحة موضحة باللون الأخضر.";
                document.getElementById('hint-text').innerText = hintMsg;
                document.getElementById('hint').style.display = 'block';
                document.getElementById('next-btn').style.display = 'inline-block';
            }
        }

        function handleTimeOut() {
            const currentData = selectedQuestions[currentQuiz];
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.disabled = true);

            allButtons[currentData.correct].classList.add('correct');
            document.getElementById('avatar').innerHTML = "⏰";

            let hintMsg = currentData.hint || "ركز في المرة القادمة!";
            document.getElementById('hint-text').innerText = "انتهى الوقت! " + hintMsg;
            document.getElementById('hint').style.display = 'block';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuiz++;
            if (currentQuiz < selectedQuestions.length) {
                loadQuiz();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval); // التأكد من إيقاف المؤقت
            userData.score = score;

            document.getElementById('quiz-screen').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';

            resultScreen.innerHTML = `
                <h2 style="color: var(--scout-green); margin-bottom: 20px;">جاري حفظ النتيجة... ⏳</h2>
                <p style="font-size: 1.2rem;">برجاء الانتظار ثانية واحدة وعدم إغلاق الصفحة.</p>
            `;

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(userData)
            })
                .then(() => {
                    let message = "";
                    let percentage = (score / QUESTIONS_PER_GAME) * 100;

                    if (percentage >= 70) {
                        message = "رائع جداً! مجهود مشرف، تم تسجيل نتيجتك بنجاح.";
                        createConfetti();
                        setTimeout(createConfetti, 500);
                    } else {
                        message = "محاولة جيدة، تم تسجيل نتيجتك. استمر في القراءة والتعلم!";
                    }

                    resultScreen.innerHTML = `
                    <h2 style="color: var(--scout-green); margin-bottom: 15px;">تم الحفظ يا ${userData.name} ✅</h2>
                    <h3 style="margin-bottom: 15px;">النتيجة: <span style="color: var(--danger); font-size: 2.5rem;">${score}</span> / ${QUESTIONS_PER_GAME}</h3>
                    <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; line-height: 1.5;">${message}</p>
                    <p style="color: #666; font-size: 1.1rem;">اسم الرهط: ${userData.patrol}</p>
                `;
                })
                .catch((error) => {
                    resultScreen.innerHTML = `
                    <h2 style="color: red; margin-bottom: 15px;">حدث خطأ في الاتصال بالإنترنت!</h2>
                    <h3 style="margin-bottom: 15px;">نتيجتك: <span style="color: var(--danger); font-size: 2.5rem;">${score}</span> / ${QUESTIONS_PER_GAME}</h3>
                    <p>يرجى أخذ "سكرين شوت" لهذه الشاشة وإرسالها للقائد.</p>
                `;
                });
        }

        function createConfetti() {
            const colors = ['#d4af37', '#28a745', '#1f4e3d', '#dc3545'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }
    </script>
</body>

</html>
